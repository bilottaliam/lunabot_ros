bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom   # plans in Point-LIO's frame; goals come in the tag-anchored arena frame (AUTONOMY.md)
    robot_base_frame: base_link
    odom_topic: /lio_odom  # /odometry/filtered had no publisher (UKF disabled)
    bt_loop_duration: 20
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    # Lyrical replaced error_code_names (full names) with prefixes; same codes as before
    error_code_name_prefixes:
      - compute_path
      - follow_path

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["MPPI", "PurePursuit"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15   # dump placement needs it; was 0.9
      yaw_goal_tolerance: 0.15
      stateful: true
    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.25
      vx_min: -0.2
      vy_max: 0.25
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # Lyrical loads the motion model as a plugin named by motion_model
      DiffDrive:
        plugin: "mppi::DiffDriveMotionModel"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.55
        cost_scaling_factor: 10.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
    PurePursuit:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.25   # was desired_linear_vel (deprecated name in Lyrical)
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # The Reeds-Shepp planner plans any reversing explicitly (penalized, collision-checked); follow it as
      # planned. RPP can't do both, so no in-place line-up turns: the planner handles start/goal headings.
      use_rotate_to_heading: false
      allow_reversing: true
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      # Fixed 16 x 16 m window: with two static layers of different geometry (RTAB-Map 4 cm, terrain 5 cm)
      # a non-rolling costmap resized itself to whichever map arrived last, every update.
      rolling_window: true
      width: 16
      height: 16
      robot_base_frame: base_link
      use_sim_time: true
      footprint: "[ [0.6, 0.41], [0.6, -0.41], [-0.45, -0.41], [-0.45, 0.41] ]"  # same as the real robot (rear: fisheye mast)
      resolution: 0.05
      track_unknown_space: true
      # StaticLayer reads these at the costmap level, not per layer. Max-combine RTAB-Map's map with the
      # terrain grid; non-trinary so terrain "unknown" (25) costs ~63 and the planner avoids unknown space.
      use_maximum: true
      trinary_costmap: false
      # Obstacles come from terrain_mapper only (rocks, craters, and the walls/ducts/column it sees as tall
      # blobs). RTAB-Map's /map layer was redundant, and when RTAB-Map hadn't published yet the costmap
      # never became current, which stalled the planner.
      plugins: ["terrain_layer", "inflation_layer"]
      terrain_layer:  # lunabot_nav terrain_mapper: rocks above / craters below the ground, with hard margins
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /terrain/grid
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true   # where the robot stands is free; otherwise one noisy cell can pin it
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8   # >= circumscribed radius (0.72): Smac needs it for exact footprint checks
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      rolling_window: true
      width: 5
      height: 5
      robot_base_frame: base_link
      use_sim_time: true
      footprint: "[ [0.6, 0.41], [0.6, -0.41], [-0.45, -0.41], [-0.45, 0.41] ]"  # same as the real robot (rear: fisheye mast)
      resolution: 0.05
      track_unknown_space: true
      # StaticLayer reads these at the costmap level, not per layer. Max-combine RTAB-Map's map with the
      # terrain grid; non-trinary so terrain "unknown" (25) costs ~63 and the planner avoids unknown space.
      use_maximum: true
      trinary_costmap: false
      # Obstacles come from terrain_mapper only (rocks, craters, and the walls/ducts/column it sees as tall
      # blobs). RTAB-Map's /map layer was redundant, and when RTAB-Map hadn't published yet the costmap
      # never became current, which stalled the planner.
      plugins: ["terrain_layer", "inflation_layer"]
      terrain_layer:  # lunabot_nav terrain_mapper: rocks above / craters below the ground, with hard margins
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /terrain/grid
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true   # where the robot stands is free; otherwise one noisy cell can pin it
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8   # >= circumscribed radius (0.72): Smac needs it for exact footprint checks
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true
    # All candidates stay loaded; the mission executive picks one with planner_selector.
    planner_plugins: ["GridBased", "Hybrid", "HybridRS", "Lattice"]
    GridBased:  # Smac 2D (grid A*) + smoother: kinematically unaware, assumes a circular robot
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
    Hybrid:  # Hybrid-A*, forward-only Dubins arcs (no reversing, no spot turns mid-path)
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"
      minimum_turning_radius: 0.5
      angle_quantization_bins: 72
      reverse_penalty: 3.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 10.0
      cache_obstacle_heuristic: true
      smooth_path: true
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
    HybridRS:  # Hybrid-A*, Reeds-Shepp (may reverse, penalized)
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"
      minimum_turning_radius: 0.5
      angle_quantization_bins: 72
      reverse_penalty: 3.0
      change_penalty: 0.5
      non_straight_penalty: 1.2
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 10.0
      cache_obstacle_heuristic: true
      smooth_path: true
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
    Lattice:  # State Lattice, diff-drive primitives (0.5 m arcs + in-place turns, penalized)
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/opt/ros/lyrical/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_reverse_expansion: true
      rotation_penalty: 5.0
      reverse_penalty: 3.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 10.0
      cache_obstacle_heuristic: true
      smooth_path: true
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.4

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0