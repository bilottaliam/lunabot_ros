controller_manager:
  ros__parameters:
    update_rate: 100

    position_controller:
      type: forward_command_controller/ForwardCommandController
    
    camera_controller:
      type: forward_command_controller/ForwardCommandController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

position_controller:
  ros__parameters:
    joints:
      - base_bucket_joint
    interface_name: position

camera_controller:
  ros__parameters:
    joints:
      - camera_fisheye_yaw_joint
    interface_name: position

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      ["base_front_left_wheel_joint", "base_rear_left_wheel_joint"]
    right_wheel_names:
      ["base_front_right_wheel_joint", "base_rear_right_wheel_joint"]
    wheel_separation: 0.5
    # Skid steer: the wheels scrub sideways when turning, so the robot only reaches ~61% of the
    # commanded yaw rate with the geometric track. Effective track = 1.64 x 0.5 m, measured in the sim
    # (see REVIEW.md). Corrects both the commanded wheel speeds and the odometry yaw.
    wheel_separation_multiplier: 1.64
    wheel_radius: 0.1016  # matches the URDF wheel collision cylinder
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    # Measured wheel motion, not integrated commands: /wheel_odom feeds the sim's UKF, and open loop it
    # reported motion even when the robot was jammed.
    open_loop: false
    pose_covariance_diagonal: [0.01, 0.01, 1.0, 1.0, 1.0, 0.03]   # z/roll/pitch unused (2D)
    twist_covariance_diagonal: [0.04, 0.04, 1.0, 1.0, 1.0, 0.03]   # skid steer slips: wheels overstate travel ~9%
    velocity_rolling_window_size: 2
    enable_odom_tf: false
    position_feedback: true
