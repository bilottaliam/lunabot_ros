# TEST ONLY (sim_test_odom:=true): physics-engine odometry (5 mm noise) + wheels + gyro, so planning and
# mission logic can be evaluated without the sim's lidar-odometry drift. Results from it are labelled.
# Normal sim odometry (robot_localization EKF; the UKF went NaN on the noiseless sim IMU): Point-LIO + wheel odometry + IMU yaw rate -> odom->base_link and /odometry/filtered.
# In the sim, lidar odometry alone drifted 0.2-1 m (worse under load) whenever the skid steer turned or
# scrubbed (AUTONOMY.md); fusing measured wheel speeds and the gyro keeps the pose continuous, and
# Point-LIO is taken differentially with a jump gate, so a bad LIO step is rejected, not followed.
# The real robot has no wheel odometry topic yet (ukf_params.yaml is unchanged and unused).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /sim_test_odom            # x, y, yaw from the physics engine
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 20


    odom1: /wheel_odom               # measured wheel speeds: vx, yaw rate
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 20

    imu0: /livox/imu_body            # gyro yaw rate
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
